name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  # docs / .agents / markdown のみの変更では重いジョブをスキップする（#46 C）
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # 否定パターンを効かせるには every + 肯定の catch-all が必要
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.agents/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/pull_request_template.md'

  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/build-image.yml

  checks:
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: /pnpm-store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - uses: Swatinem/rust-cache@v2
        with:
          key: checks
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:all

  # PR では走らせない。main push のみ（#46 A）
  bundle-linux:
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: /pnpm-store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @swallow/desktop tauri build --ci --bundles deb
      - uses: actions/upload-artifact@v7
        with:
          name: swallow-linux-deb
          path: target/release/bundle/deb/*.deb
          retention-days: 7

  # PR では走らせない。main push のみ（#46 A）
  build-native:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Rust toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @swallow/desktop tauri build --ci --no-bundle
