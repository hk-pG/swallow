name: Build image

# Builds the CI container only when its inputs change. The tag is a hash of
# those inputs, so every commit resolves to an image matching its own toolchain.
on:
  workflow_call:
    outputs:
      image:
        description: Fully qualified image reference
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          hash=$({
            cat docker/build.Dockerfile rust-toolchain.toml .nvmrc
            node -p "require('./package.json').packageManager"
          } | sha256sum | cut -c1-16)
          echo "image=ghcr.io/${owner}/swallow-build:${hash}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: exists
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.image }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - if: steps.exists.outputs.exists == 'false'
        run: echo "NODE_MAJOR=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_ENV"

      - if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/build.Dockerfile
          build-args: NODE_MAJOR=${{ env.NODE_MAJOR }}
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=build-image
          cache-to: type=gha,scope=build-image,mode=max
