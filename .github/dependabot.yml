# Dependabot: pnpm モノレポ + Cargo workspace + GitHub Actions
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # pnpm-lock.yaml / package.json はリポジトリ根。ワークスペース配下もここから更新される。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-production:
        dependency-type: production
      npm-development:
        dependency-type: development

  # Cargo workspace 根（members: apps/desktop/src-tauri）
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns:
          - "*"
    # RUSTSEC-2024-0429 / GHSA-wrw7-89jp-8q8g。
    # glib 0.18.5 は tauri の gtk-rs 0.18（Linux のみ）経由の推移依存で、
    # 脆弱な VariantStrIter は呼んでいない。
    # stable Tauri が gtk 0.19 / glib >= 0.20 に移ったらこの ignore を外す。
    ignore:
      - dependency-name: "glib"
        versions: ["<0.20.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
