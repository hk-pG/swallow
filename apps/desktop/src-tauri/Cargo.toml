[package]
name = "swallow"
description = "Asset library manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows.
# https://github.com/rust-lang/cargo/issues/8519
name = "swallow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "3.0.0"
imagesize = "0.15.0"
tauri-plugin-dialog = "2"
thiserror = "2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "rayon"] }
tokio = { version = "1.53.3", features = ["sync"] }
percent-encoding = "2.3.2"
tiny_http = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
